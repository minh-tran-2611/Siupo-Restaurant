# Cloud Build pipeline cho BE (Spring Boot) -> Cloud Run
# Dùng Dockerfile sẵn có trong BE/. DB = Cloud SQL (MySQL), Redis = Memorystore (qua VPC connector).

substitutions:
  _SERVICE: siupo-be
  _REGION: us-central1
  _REPO: siupo
  _TAG: latest
  # Cloud SQL connection name: PROJECT:REGION:INSTANCE
  _CLOUDSQL_INSTANCE: project-b4b13663-816a-47bd-98c:us-central1:siupo-mysql
  # Serverless VPC connector để nối Memorystore Redis (IP nội bộ)
  _VPC_CONNECTOR: siupo-conn
  # IP nội bộ của Memorystore Redis (điền sau khi tạo xong)
  _REDIS_HOST: 10.164.194.251
  # URL Cloud Run (hash project mới: 2twyqzvq7q)
  _FRONTEND_URL: https://siupo-fe-customer-2twyqzvq7q-uc.a.run.app
  _ADMIN_FRONTEND_URL: https://siupo-fe-admin-2twyqzvq7q-uc.a.run.app
  _LEGACY_FRONTEND_URL: https://siupo-fe-customer-1036531815025.us-central1.run.app
  _LEGACY_ADMIN_FRONTEND_URL: https://siupo-fe-admin-1036531815025.us-central1.run.app
  _BACKEND_URL: https://siupo-be-2twyqzvq7q-uc.a.run.app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: BE                       # monorepo: trigger chạy từ gốc repo -> build trong thư mục service
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=3
      - --timeout=300
      # Cloud SQL nối qua Unix socket /cloudsql/<instance>
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      # VPC connector để chạm Memorystore Redis qua IP nội bộ
      - --vpc-connector=${_VPC_CONNECTOR}
      # Biến môi trường không nhạy cảm
      - "--set-env-vars=^|^SPRING_PROFILES_ACTIVE=prod|JAVA_OPTS=-Xms256m -Xmx768m|JWT_ACCESS_EXPIRATION=900000|JWT_REFRESH_EXPIRATION=604800000|SPRING_MAIL_HOST=smtp.gmail.com|SPRING_MAIL_PORT=587|APP_DEFAULT_ADMIN_EMAIL=admin@siupo.com|APP_DEFAULT_ADMIN_FULLNAME=System Administrator|MOMO_PARTNER_CODE=MOMO|APP_FRONTEND_URL=${_FRONTEND_URL}|APP_BACKEND_URL=${_BACKEND_URL}|APP_CORS_ALLOWED_ORIGINS=${_FRONTEND_URL},${_ADMIN_FRONTEND_URL},${_LEGACY_FRONTEND_URL},${_LEGACY_ADMIN_FRONTEND_URL}|CLOUDINARY_NAME=delsqnlsu|GOOGLE_CLIENT_ID=1036531815025-stt9ap9a65ncvl5p4253sqic485sfkqd.apps.googleusercontent.com|SPRING_DATA_REDIS_HOST=${_REDIS_HOST}|SPRING_DATA_REDIS_PORT=6379"
      # Giá trị nhạy cảm lấy từ Secret Manager
      - --set-secrets=SPRING_DATASOURCE_URL=SPRING_DATASOURCE_URL:latest,SPRING_DATASOURCE_USERNAME=SPRING_DATASOURCE_USERNAME:latest,SPRING_DATASOURCE_PASSWORD=SPRING_DATASOURCE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,SPRING_MAIL_USERNAME=SPRING_MAIL_USERNAME:latest,SPRING_MAIL_PASSWORD=SPRING_MAIL_PASSWORD:latest,APP_DEFAULT_ADMIN_PASSWORD=APP_DEFAULT_ADMIN_PASSWORD:latest,MOMO_ACCESS_KEY=MOMO_ACCESS_KEY:latest,MOMO_SECRET_KEY=MOMO_SECRET_KEY:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,REDIS_PASSWORD=REDIS_PASSWORD:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

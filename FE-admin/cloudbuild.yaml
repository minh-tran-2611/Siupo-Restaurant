# Cloud Build: FE-admin (Vite) -> nginx -> Cloud Run
substitutions:
  _SERVICE: siupo-fe-admin
  _REGION: us-central1
  _REPO: siupo
  _TAG: latest
  _API_BASE_URL: https://siupo-be-2twyqzvq7q-uc.a.run.app/api
  _AI_AGENT_BASE_URL: https://siupo-ai-service-2twyqzvq7q-uc.a.run.app/api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: FE-admin               # monorepo: trigger chạy từ gốc repo -> build trong thư mục service
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --build-arg=VITE_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=VITE_AI_AGENT_BASE_URL=${_AI_AGENT_BASE_URL}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
